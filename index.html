<title>LOVE PROFILE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#08090c;
    color:#f4f1ec;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 15%,rgba(150,35,55,.18),transparent 32%),
        radial-gradient(circle at 85% 80%,rgba(180,180,190,.08),transparent 30%);
}

/* 页面 */

.screen{
    position:relative;
    z-index:1;
    width:100%;
    min-height:100vh;
    display:none;
}

.screen.active{
    display:flex;
}


/* =========================
   密码页面
========================= */

#passwordPage{
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.password-box{
    position:relative;
    z-index:10;
    width:min(430px,100%);
    padding:55px 28px;
    text-align:center;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(12,13,17,.96);
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.archive{
    color:#777a82;
    font-size:11px;
    letter-spacing:5px;
    margin-bottom:28px;
}

.heart{
    width:62px;
    height:62px;
    margin:0 auto 24px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
}

.password-box h1{
    font-family:Georgia,"Microsoft YaHei",serif;
    font-weight:400;
    font-size:34px;
    letter-spacing:3px;
}

.sub{
    color:#858890;
    font-size:11px;
    letter-spacing:3px;
    margin:12px 0 32px;
}


/* 重点：输入框 */

#codeInput{
    position:relative;
    z-index:20;

    display:block;

    width:100%;
    height:56px;

    padding:0 15px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:0;

    outline:none;

    background:#15161b !important;
    color:#ffffff !important;

    font-size:22px;
    text-align:center;
    letter-spacing:10px;

    -webkit-appearance:none;
    appearance:none;

    pointer-events:auto;
    user-select:text;
    -webkit-user-select:text;
}

#codeInput::placeholder{
    color:#555861;
    opacity:1;
}

#codeInput:focus{
    border-color:#bd5363;
    background:#18191f !important;
    box-shadow:0 0 20px rgba(189,83,99,.12);
}


.enter-btn{
    position:relative;
    z-index:20;

    width:100%;
    height:55px;

    margin-top:14px;

    border:none;

    background:#eeeae5;
    color:#111;

    font-size:13px;
    letter-spacing:5px;

    cursor:pointer;

    pointer-events:auto;

    transition:.25s;
}

.enter-btn:active{
    transform:scale(.98);
}

.enter-btn:hover{
    background:#fff;
}

.error{
    min-height:22px;
    margin-top:13px;
    color:#c45b69;
    font-size:12px;
}


/* =========================
   首页
========================= */

#introPage{
    align-items:center;
    justify-content:center;
    padding:30px;
}

.intro{
    width:min(750px,100%);
    text-align:center;
}

.eyebrow{
    color:#777a82;
    font-size:11px;
    letter-spacing:6px;
    margin-bottom:22px;
}

.intro h1{
    font-family:Georgia,"Microsoft YaHei",serif;
    font-size:clamp(45px,8vw,78px);
    font-weight:400;
    line-height:1.1;
    letter-spacing:5px;
}

.intro h1 span{
    color:#a63e4d;
}

.line{
    width:70px;
    height:1px;
    margin:30px auto;
    background:rgba(255,255,255,.3);
}

.intro p{
    max-width:540px;
    margin:auto;
    color:#9699a1;
    font-size:13px;
    line-height:2.1;
}

.start-btn{
    margin-top:40px;
    padding:16px 55px;
    background:transparent;
    border:1px solid rgba(255,255,255,.28);
    color:#eee;
    font-family:inherit;
    letter-spacing:4px;
    cursor:pointer;
}

.start-btn:hover{
    border-color:#a63e4d;
    background:rgba(140,40,55,.12);
}


/* =========================
   测试页面
========================= */

#quizPage{
    flex-direction:column;
    align-items:center;
    padding:35px 20px 60px;
}

.quiz-wrap{
    width:min(720px,100%);
}

.quiz-head{
    display:flex;
    justify-content:space-between;
    color:#777a82;
    font-size:11px;
    letter-spacing:2px;
}

.progress{
    width:100%;
    height:2px;
    margin-top:12px;
    margin-bottom:45px;
    background:rgba(255,255,255,.1);
}

.progress-bar{
    width:0;
    height:100%;
    background:#a63e4d;
    transition:.3s;
}

.question-number{
    color:#777a82;
    font-family:Georgia,serif;
    font-size:20px;
    margin-bottom:15px;
}

.question{
    font-size:25px;
    line-height:1.7;
    margin-bottom:32px;
}

.answers{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.answer{
    position:relative;
    padding:17px 20px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.025);
    color:#c5c6ca;
    font-size:14px;
    line-height:1.6;
    cursor:pointer;
    transition:.25s;
}

.answer:hover{
    border-color:#91404d;
    transform:translateX(3px);
}

.answer.selected{
    color:white;
    border-color:#a63e4d;
    background:rgba(145,48,64,.16);
}

.answer.selected::after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    border-radius:50%;
    background:#c45b69;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

.nav{
    padding:12px 25px;
    border:1px solid rgba(255,255,255,.15);
    background:transparent;
    color:#aaa;
    cursor:pointer;
}

.nav.next{
    background:#eeeae5;
    color:#111;
}

.nav:disabled{
    opacity:.25;
}


/* =========================
   结果
========================= */

#resultPage{
    justify-content:center;
    padding:30px 15px 60px;
}

.result{

    border:1px solid rgba(255,255,255,.13);
    background:rgba(14,15,19,.95);

.result::before{
    content:"";

    width:300px;
    height:300px;
    right:-150px;
    top:-150px;
    border:1px solid rgba(255,255,255,.07);

.label{
    color:#777a82;
    font-size:11px;
    letter-spacing:5px;
}

.result h2{
    position:relative;

    font-size:58px;
    font-weight:400;
    margin-top:12px;
}

.result-en{
    color:#a63e4d;
    letter-spacing:4px;
    margin-top:5px;
}

.result-line{
    width:100%;
    height:1px;
    background:rgba(255,255,255,.1);
    margin:32px 0;
}

.description{
    color:#bcbec4;
    line-height:2;
    font-size:14px;
}

.profile-title{
    color:#777a82;
    font-size:11px;
    letter-spacing:4px;
    margin-top:35px;
    margin-bottom:20px;
}

.bar-row{
    margin-bottom:15px;
}

.bar-head{
    display:flex;
    justify-content:space-between;
    color:#aaa;
    font-size:12px;
    margin-bottom:6px;

.bar{

    height:3px;
    background:rgba(255,255,255,.08);
}

.bar-inner{
    height:100%;
    background:#a63e4d;

.tags{

.tag{

.section{
    margin-top:35px;

.section h3{
    font-size:13px;
    letter-spacing:3px;
    margin-bottom:12px;
    font-weight:400;
}

.section p{
    color:#9699a1;

.quote{

    color:#c7c8cc;

.restart{
    display:block;
    margin:40px auto 0;
    padding:14px 45px;
    border:0;
    background:#eeeae5;
    color:#111;
    letter-spacing:4px;

/* 手机 */

    }

        font-size:45px;
    }

</style>

function checkCode(){

    const value =
        codeInput.value.trim();

    if(value === ACCESS_CODE){

        error.textContent = "";

        showPage("introPage");

    }else{

        error.textContent =
            "提取码错误，请重新输入";

        codeInput.value = "";

        codeInput.focus();

    }
}


enterBtn.addEventListener(
    "click",
    checkCode
);


codeInput.addEventListener(

/* =========================
   测试状态
========================= */

let current = 0;

let answers =
    new Array(questions.length).fill(null);


/* =========================
   页面切换
========================= */

function showPage(id){

    document
        .querySelectorAll(".screen")
        .forEach(page=>{
            page.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    window.scrollTo(0,0);
}


/* =========================
   开始测试
========================= */

function startQuiz(){

    current = 0;

    answers =
        new Array(questions.length).fill(null);

    showPage("quizPage");

    renderQuestion();
}


/* =========================
   显示题目
========================= */

function renderQuestion(){

    const q =
        questions[current];

    document.getElementById("count")
        .textContent =
        String(current+1).padStart(2,"0")
        +" / "
        +String(questions.length).padStart(2,"0");


    document.getElementById("progressBar")
        .style.width =
        ((current+1)/questions.length*100)+"%";


    const box =
        document.getElementById("questionBox");


    box.innerHTML = `

        <div class="question-number">
            QUESTION ${String(current+1).padStart(2,"0")}
        </div>

        <div class="question">
            ${q.q}
        </div>

        <div class="answers">

            ${q.a.map((item,index)=>`

                <div
                    class="answer ${
                        answers[current] === index
                        ? "selected"
                        : ""
                    }"
                    onclick="selectAnswer(${index})">

                    ${item}

                </div>

            `).join("")}

        </div>

    `;


    document.getElementById("prevBtn")
        .disabled = current === 0;


    document.getElementById("nextBtn")
        .textContent =
        current === questions.length-1
        ? "查看结果"
        : "下一题";
}


/* =========================
   选择答案
========================= */

function selectAnswer(index){

    answers[current] = index;

    renderQuestion();
}


/* =========================
   下一题
========================= */

function nextQuestion(){

    if(answers[current] === null){

        alert("请选择一个答案");

        return;
    }


    if(current < questions.length-1){

        current++;

        renderQuestion();

    }else{

        calculateResult();

    }
}


/* =========================
   上一题
========================= */

function prevQuestion(){

    if(current > 0){

        current--;

        renderQuestion();

    }
}


/* =========================
   自动计分
========================= */

function calculateResult(){

    const score =
        new Array(12).fill(0);


    const map = [

        [2,0,5,7,11,6],
        [7,4,0,5,11,6],
        [1,10,8,5,11,6],
        [2,4,3,9,0,5],
        [2,7,3,4,10,6],
        [1,0,5,3,11,6],
        [3,4,11,1,10,0],
        [2,4,3,9,11,6],
        [7,1,5,9,4,6],
        [4,7,9,3,10,1],
        [0,1,2,3,4,5],
        [2,1,5,10,11,6],
        [7,0,10,3,4,1],
        [3,1,5,11,4,6],
        [2,10,9,11,4,1],
        [2,7,5,10,4,6],
        [3,5,2,9,4,6],
        [2,7,10,11,4,1]

    ];


    answers.forEach((answer,i)=>{

        const result =
            map[i][answer];

        score[result] += 5;

        score[(result+1)%12] += 1;

        score[(result+2)%12] += .5;

    });


    const max =
        Math.max(...score);

    const index =
        score.indexOf(max);


    showResult(index);
}


/* =========================
   显示结果
========================= */

function showResult(index){

    const result =
        results[index];


    document.getElementById("resultType")
        .textContent = result.type;


    document.getElementById("resultEn")
        .textContent = result.en;


    document.getElementById("resultDesc")
        .textContent = result.desc;


    document.getElementById("loveStyle")
        .textContent = result.loveStyle;


    document.getElementById("heartBeat")
        .textContent = result.heartBeat;


    document.getElementById("relationship")
        .textContent = result.relationship;


    document.getElementById("hidden")
        .textContent = result.hidden;


    document.getElementById("quote")
        .textContent = result.quote;


    const labels = [
        "心动指数",
        "主动程度",
        "情绪浓度",
        "边界意识"
    ];


    const bars =
        document.getElementById("profileBars");


    bars.innerHTML = "";


    result.bars.forEach((value,i)=>{

        bars.innerHTML += `

            <div class="bar-row">

                <div class="bar-head">

                    <span>
                        ${labels[i]}
                    </span>

                    <span>
                        ${value}%
                    </span>

                </div>

                <div class="bar">

                    <div
                        class="bar-inner"
                        style="width:${value}%">
                    </div>

                </div>

            </div>

        `;

    });


    document.getElementById("traits")
        .innerHTML =
        result.traits.map(item=>`
            <span class="tag">
                ${item}
            </span>
        `).join("");


    showPage("resultPage");
}


/* =========================
   重新测试
========================= */

function restartTest(){

    current = 0;

    answers =
        new Array(questions.length).fill(null);

    showPage("introPage");
}
